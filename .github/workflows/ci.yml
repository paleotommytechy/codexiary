name: Build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install
      - name: Type check
        id: typecheck
        continue-on-error: true
        run: npm run lint > ts-report.log 2>&1
      - name: Report typecheck errors on PR
        if: steps.typecheck.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('ts-report.log','utf8').slice(0,55000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Typecheck diagnostics (temporary):\n\n```text\n' + log + '\n```',
            });
      - name: Fail on type errors
        if: steps.typecheck.outcome == 'failure'
        run: exit 1
      - name: Build
        run: npm run build
